# nginx reverse proxy for a Hostinger VPS.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/rejifash
#   sudo ln -s /etc/nginx/sites-available/rejifash /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.yourdomain.com
#
# Replace shop.yourdomain.com throughout with your actual subdomain, and point
# an A record at this server's IP in Hostinger's DNS first.

server {
    listen 80;
    listen [::]:80;
    server_name shop.yourdomain.com;

    # certbot rewrites this block to redirect to HTTPS once a certificate is
    # issued. Payment pages must not be served over plain HTTP.
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    # Payment screenshots arrive as base64 JSON, so the default 1 MB body limit
    # is too small — the browser caps uploads well under this.
    client_max_body_size 12m;

    # Processed product photographs are content-hashed at upload, so they can
    # be cached hard.
    location /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # The admin dashboard is the one thing worth locking down further. Uncomment
    # to restrict it to your own IP, or put HTTP basic auth in front of it as a
    # second factor on top of the app's own login.
    #
    # location /admin {
    #     allow 203.0.113.4;   # your IP
    #     deny all;
    #     proxy_pass http://127.0.0.1:4173;
    #     proxy_set_header Host $host;
    # }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
