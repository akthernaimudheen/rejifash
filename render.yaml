# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploying from this file gives the shop a subdomain at
#   https://<service-name>.onrender.com
#
# Change `name` below to claim a different subdomain (it must be globally
# unique across Render), then set ADMIN_PASSWORD and UPI_VPA in the dashboard.
services:
  - type: web
    name: rejifash
    runtime: node
    plan: free
    region: singapore # closest Render region to India
    buildCommand: echo "no build step — zero dependencies"
    startCommand: node server/server.js
    healthCheckPath: /api/config

    envVars:
      - key: NODE_ENV
        value: production

      # Required. The server refuses to boot in production without it, because
      # the default password is published in the README and /admin would
      # otherwise be open to anyone who finds the URL.
      - key: ADMIN_PASSWORD
        sync: false

      # The UPI ID every payment QR points at. Set this before taking real
      # orders — customers pay whatever address is here.
      - key: UPI_VPA
        sync: false

      - key: WHATSAPP_NUMBER
        value: "919074666413"

      # "link" (manual, no setup) | "callmebot" | "cloud" | "twilio"
      - key: WHATSAPP_PROVIDER
        value: link

      - key: CALLMEBOT_API_KEY
        sync: false

      # DATA_DIR is deliberately NOT set here. Left unset, orders are written
      # inside the project directory, which is always writable. Only point it
      # at /var/data once you've attached the disk below — otherwise the app
      # may fail to create the directory and crash on boot.
      #
      # - key: DATA_DIR
      #   value: /var/data

    # Persistent storage for orders and uploaded photographs.
    #
    # WITHOUT THIS, ON THE FREE PLAN, DATA IS LOST: the filesystem is wiped on
    # every deploy and on the automatic spin-down after 15 minutes idle. Fine
    # for demoing, not for real customers.
    #
    # Disks require a paid instance type. To enable: raise `plan` above, then
    # uncomment both this block and the DATA_DIR variable above.
    #
    # disk:
    #   name: reji-data
    #   mountPath: /var/data
    #   sizeGB: 1
